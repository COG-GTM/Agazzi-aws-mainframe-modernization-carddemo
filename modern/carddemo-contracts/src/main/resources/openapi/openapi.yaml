openapi: 3.0.3
info:
  title: CardDemo online API
  version: contracts-v1
  description: |
    One resource per BMS map (plan §3.3, Fase 3). GET = first send (PGM-CONTEXT ENTER),
    POST = terminal input (action = AID key + unprotected map fields). Every response is a
    ScreenResponse (messages, nextScreen, fieldErrors, context). Operations tagged
    `optional-extension` exist only when carddemo.extensions.<name>.enabled=true (X1-X3).
    GENERATED by modern/tools/contracts/generate_contracts.py.
servers:
  - url: http://localhost:8080
tags:
  - name: o1-auth
  - name: o2-account
  - name: o3-card
  - name: o4-transaction
  - name: o5-useradmin
  - name: x1-authorization
  - name: x2-trantype
  - name: optional-extension
    description: Disabled unless the extension flag is on.
  - name: platform
paths:
  /api/v1/screens/coactup:
    get:
      tags: [o2-account]
      operationId: getCoactup
      summary: CAUP COACTUPC - first send of map CACTUPA
      responses:
        '200':
          description: Screen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoactupResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [o2-account]
      operationId: postCoactup
      summary: CAUP COACTUPC - receive map CACTUPA (AID key + fields)
      requestBody:
        required: true
        content:
