  /api/v1/jobs/{executionId}:
    get:
      tags: [o4-transaction]
      operationId: getReportJob
      summary: Status of a report job submitted by CR00 (ReportJobLauncherPort, implemented by B3/B5)
      parameters:
        - { name: executionId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportJobHandle' }
        '404': { description: Unknown execution }
  /actuator/maintenance:
    get:
      tags: [platform]
      operationId: getMaintenanceMode
      summary: OPENFIL/CLOSEFIL state (MaintenanceModePort, B5)
      responses:
        '200':
          description: Closed files
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceState' }
components:
  responses:
    Unauthorized: { description: Not signed on (no session) }
    Forbidden: { description: User type not allowed (e.g. non-admin on CA00/CU*) }
  schemas:
    Action:
      type: string
      description: AID key pressed (DFHAID)
      enum: [ENTER, CLEAR, PA1, PA2, PF1, PF2, PF3, PF4, PF5, PF6, PF7, PF8, PF9, PF10, PF11, PF12]
    ScreenMessage:
      type: object
      required: [severity, text]
      properties:
        severity: { type: string, enum: [INFO, ERROR] }
        text: { type: string }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string, description: BMS field name }
        message: { type: string }
    ConversationContext:
      type: object
      description: Mirror of COCOM01Y (CARDDEMO-COMMAREA)
      properties:
        fromTransactionId: { type: string }
        fromProgram: { type: string }
        toTransactionId: { type: string }
        toProgram: { type: string }
        userId: { type: string }
        userType: { type: string }
        programContext: { type: string }
        customerId: { type: integer, format: int64 }
        customerFirstName: { type: string }
        customerMiddleName: { type: string }
        customerLastName: { type: string }
        accountId: { type: integer, format: int64 }
        accountStatus: { type: string }
        cardNumber: { type: integer, format: int64 }
        lastMap: { type: string }
        lastMapset: { type: string }
    ReportJobHandle:
      type: object
      properties:
        executionId: { type: integer, format: int64 }
        jobName: { type: string }
        status: { type: string }
    MaintenanceState:
      type: object
      properties:
        closedFiles: { type: array, items: { type: string } }
    CoactupInput:
      type: object
