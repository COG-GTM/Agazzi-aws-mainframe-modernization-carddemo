# UPDATE-USER-INFO: PASSWD is never sent to the screen (PE-O5-02), so blank = keep the stored
# credential (PE-O5-05) instead of 'Password can NOT be empty...'.
id: CU02-007
title: PF5 con PASSWD vuoto mantiene la password
tranid: CU02
screen: COUSR02
steps:
  - action: PF5
    fields: {USRIDIN: "USER0001", FNAME: "USER", LNAME: "0001", PASSWD: "", USRTYPE: "U"}
    expect:
      message: "Please modify to update ..."
      dbDelta: none
  - action: PF5
    fields: {USRIDIN: "USER0001", FNAME: "USER", LNAME: "Bianchi", PASSWD: "", USRTYPE: "U"}
    expect:
      message: "User USER0001 has been updated ..."
      fieldErrors: []
      db: {USER0001: {lname: Bianchi, password: PASSWORD, bcrypt: false}}
