name: Java CI

on:
  push:
    branches: [ main ]
    paths:
      - 'carddemo-java/**'
      - '.github/workflows/java-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'carddemo-java/**'
      - '.github/workflows/java-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carddemo-java

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean compile

      - name: Run tests
        run: mvn -B test

      - name: Package
        run: mvn -B package -DskipTests
