name: modern-ci

on:
  push:
    paths: ["modern/**", ".github/workflows/modern-ci.yml", "app/**"]
  pull_request:
    branches: [main, "migration/**"]

permissions:
  contents: read

concurrency:
  group: modern-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: modern

jobs:
  ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml==6.0.2
      - name: Ownership coverage (every app/ artifact owned by exactly one workstream)
        run: python3 tools/inventory/check_ownership.py
      - name: Inventory and workstream prompts are up to date
        run: |
          python3 tools/inventory/inventory.py
          python3 tools/workstreams/generate_prompts.py
          git diff --exit-code -- docs MIGRATION_PROGRESS.md

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21", cache: maven}
      - name: Build, unit tests, ArchUnit, Checkstyle, Spotless, JaCoCo
        run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-and-test-reports
          path: |
            modern/**/target/site/jacoco/**
            modern/**/target/surefire-reports/**

  parity:
    runs-on: ubuntu-latest
    env:
      CARDDEMO_REQUIRE_COBOL: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21", cache: maven}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install GnuCOBOL + faketime
        run: sudo apt-get update && sudo apt-get install -y gnucobol faketime && pip install pyyaml==6.0.2
      - name: COBOL golden masters reproducible (zero diff)
        run: ./tools/golden/run-cobol.sh all --verify
      - name: Parity gate + integration tests (Testcontainers PostgreSQL 16)
        run: ./mvnw -B -Pparity,it verify

  image:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build carddemo-app image
        uses: docker/build-push-action@v6
        with:
          context: modern
          push: false
          tags: carddemo-app:ci
